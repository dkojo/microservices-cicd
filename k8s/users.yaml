# users: Deployment (2 pods) and a Service other pods reach at http://users:8080
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users
  labels: { app: users }
spec:
  replicas: 2
  selector:
    matchLabels: { app: users }
  template:
    metadata:
      labels: { app: users }
    spec:
      containers:
        - name: users
          image: ghcr.io/dkojo/microservices-cicd/users:IMAGE_TAG   # the pipeline sets the commit SHA
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 3
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000          # the image's "node" user
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: users
spec:
  selector: { app: users }
  ports:
    - port: 8080
      targetPort: 8080
